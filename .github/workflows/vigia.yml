name: vigia-bots
on:
  schedule:
    - cron: "37 20 * * *"   # 20:37 UTC: después del bot de Pinterest (18:00 hora local)
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar latidos
        env:
          LATIDO_TOPIC: ${{ secrets.LATIDO_TOPIC }}
          ALERTA_TOPIC: ${{ secrets.ALERTA_TOPIC }}
          BOTS_JSON: '{"pinterest": 6}'
        run: python vigia.py
